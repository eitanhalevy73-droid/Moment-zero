 "intro1": {"en":"Somewhere, at the exact second you arrived, the world kept doing what it always does — completely unaware that you were about to change everything for the people who love you.","he":"מבט מעמיק על השיר, השמיים, המחירים, מי שהיה בשלטון והמקום שלך ביקום — הכול מתאריך אחד.","es":"Una mirada más profunda a la canción, el cielo, los precios, quién gobernaba y tu lugar en el universo, todo a partir de una fecha.","fr":"Un regard approfondi sur la chanson, le ciel, les prix, qui dirigeait et votre place dans l\'univers — le tout à partir d\'une seule date.","de":"Ein genauerer Blick auf den Song, den Himmel, die Preise, wer regierte, und deinen Platz im Universum — alles anhand eines einzigen Datums.","it":"Uno sguardo più approfondito sulla canzone, il cielo, i prezzi, chi governava e il tuo posto nell\'universo, tutto a partire da una sola data.","pt":"Um olhar mais profundo sobre a música, o céu, os preços, quem governava e seu lugar no universo — tudo a partir de uma única data.","ru":"Более подробный взгляд на песню, небо, цены, тех, кто был у власти, и твоё место во вселенной — и всё это по одной дате.","ar":"نظرة أعمق على الأغنية والسماء والأسعار ومن كان يحكم ومكانك في الكون — كل ذلك من تاريخ واحد.","zh":"深入了解那首歌、那片天空、那些物价、当时的掌权者，以及你在宇宙中的位置——这一切都源于一个日期。"},
 "intro2": {"en":"A song was playing on the radio that would define that week. The moon hung at a particular phase, whether anyone looked up or not. Someone sat behind a desk in a particular office, making decisions that had nothing to do with you — yet. Gas, bread, and a house cost a fraction of what they do now. And Earth, carrying you along for the ride, had already begun its next lap around the sun.","he":"שיר התנגן ברדיו, שיר שהגדיר את השבוע ההוא. הירח עמד בשלב מסוים, בין אם מישהו הביט בו ובין אם לא. מישהו ישב מאחורי שולחן במשרד מסוים, וקיבל החלטות שלא היה להן שום קשר אליך — עדיין. דלק, לחם ובית עלו שבריר ממה שהם עולים היום. וכדור הארץ, שנשא אותך איתו, כבר התחיל את ההקפה הבאה שלו סביב השמש.","es":"Una canción sonaba en la radio, una que definiría esa semana. La luna estaba en una fase concreta, la mirara alguien o no. Alguien se sentaba tras un escritorio en una oficina particular, tomando decisiones que todavía no tenían nada que ver contigo. La gasolina, el pan y una casa costaban una fracción de lo que cuestan hoy. Y la Tierra, llevándote consigo, ya había comenzado su siguiente vuelta alrededor del sol.","fr":"Une chanson passait à la radio, celle qui allait marquer cette semaine-là. La lune se trouvait dans une phase précise, que quelqu\'un la regarde ou non. Quelqu\'un était assis derrière un bureau, dans un certain bureau, en train de prendre des décisions qui n\'avaient encore rien à voir avec vous. L\'essence, le pain et une maison coûtaient une fraction de ce qu\'ils coûtent aujourd\'hui. Et la Terre, qui vous emportait avec elle, avait déjà entamé son tour suivant autour du soleil.","de":"Im Radio lief ein Song, der diese Woche prägen sollte. Der Mond stand in einer bestimmten Phase, ob jemand hinaufsah oder nicht. Irgendjemand saß an einem bestimmten Schreibtisch und traf Entscheidungen, die noch nichts mit dir zu tun hatten. Benzin, Brot und ein Haus kosteten nur einen Bruchteil von heute. Und die Erde, die dich mitnahm, hatte bereits ihre nächste Runde um die Sonne begonnen.","it":"Una canzone suonava alla radio, una che avrebbe definito quella settimana. La luna si trovava in una fase precisa, che qualcuno la guardasse oppure no. Qualcuno sedeva dietro una scrivania, in un certo ufficio, prendendo decisioni che ancora non avevano nulla a che fare con te. Benzina, pane e una casa costavano una frazione di quanto costano oggi. E la Terra, portandoti con sé, aveva già iniziato il suo giro successivo intorno al sole.","pt":"Uma música tocava no rádio, uma que definiria aquela semana. A lua estava numa fase específica, quer alguém olhasse para ela ou não. Alguém estava sentado atrás de uma mesa, num determinado gabinete, tomando decisões que ainda não tinham nada a ver com você. Gasolina, pão e uma casa custavam uma fração do que custam hoje. E a Terra, levando você consigo, já tinha começado sua próxima volta ao redor do sol.","ru":"По радио играла песня, которая станет главной мелодией той недели. Луна находилась в определённой фазе — смотрел на неё кто-то или нет. Кто-то сидел за определённым столом в определённом кабинете, принимая решения, пока не имевшие к тебе никакого отношения. Бензин, хлеб и дом стоили лишь малую долю от нынешних цен. А Земля, неся тебя с собой, уже начинала следующий круг вокруг Солнца.","ar":"كانت أغنية تُذاع على الراديو، أغنية ستُحدد ملامح ذلك الأسبوع. كان القمر في طور معين، سواء نظر إليه أحد أم لا. كان شخص ما يجلس خلف مكتب معين، يتخذ قرارات لم تكن تخصك بعد. كان الوقود والخبز والمنزل يكلف جزءًا بسيطًا مما يكلفه اليوم. وكانت الأرض، التي تحملك معها، قد بدأت بالفعل جولتها التالية حول الشمس.","zh":"收音机里播放着一首将定义那一周的歌曲。月亮正处于某个特定的相位，无论有没有人抬头看它。某个人正坐在某间办公室的某张办公桌后面，做出当时还与你毫无关系的决定。汽油、面包和房子的价格只是如今的一小部分。而承载着你的地球，已经开始了绕太阳的下一圈旅程。"},
 "intro3": {"en":"Pick a date below, and we'll rebuild that exact moment — piece by piece.","he":"בחרו תאריך למטה, ואנחנו נבנה מחדש את הרגע המדויק הזה — חלק אחר חלק.","es":"Elige una fecha abajo, y reconstruiremos ese momento exacto, pieza por pieza.","fr":"Choisissez une date ci-dessous, et nous reconstruirons ce moment exact — pièce par pièce.","de":"Wähle unten ein Datum, und wir rekonstruieren diesen genauen Moment — Stück für Stück.","it":"Scegli una data qui sotto, e ricostruiremo quel momento esatto, pezzo dopo pezzo.","pt":"Escolha uma data abaixo, e reconstruiremos esse momento exato, peça por peça.","ru":"Выберите дату ниже, и мы воссоздадим этот самый момент — шаг за шагом.","ar":"اختر تاريخًا أدناه، وسنعيد بناء تلك اللحظة بالضبط، جزءًا تلو الآخر.","zh":"在下方选择一个日期，我们将一点一点重建那个确切的时刻。"},

 "secIdentitySub": {"en":"The song everyone was humming, the sky overhead, and who was running the country.","he":"השיר שכולם זמזמו, השמיים מעל, ומי שניהל את המדינה.","es":"La canción que todos tarareaban, el cielo en lo alto y quién gobernaba el país.","fr":"La chanson que tout le monde fredonnait, le ciel au-dessus et qui dirigeait le pays.","de":"Der Song, den alle summten, der Himmel darüber, und wer das Land führte.","it":"La canzone che tutti canticchiavano, il cielo sopra di te e chi governava il paese.","pt":"A música que todos cantarolavam, o céu lá em cima e quem governava o país.","ru":"Песня, которую все напевали, небо над головой и то, кто управлял страной.","ar":"الأغنية التي كان الجميع يدندنها، والسماء فوقك، ومن كان يحكم البلاد.","zh":"当时人人哼唱的歌曲、头顶的夜空，以及当时的国家领导人。"},

 "secBodySub": {"en":"A live count of every heartbeat and breath since the moment you arrived.","he":"ספירה חיה של כל פעימת לב ונשימה מהרגע שהגעת.","es":"Un recuento en vivo de cada latido y respiración desde que llegaste.","fr":"Un décompte en direct de chaque battement de cœur et de chaque respiration depuis votre arrivée.","de":"Eine Live-Zählung jedes Herzschlags und Atemzugs seit deiner Ankunft.","it":"Un conteggio in tempo reale di ogni battito e respiro da quando sei arrivato.","pt":"Uma contagem ao vivo de cada batimento e respiração desde que você chegou.","ru":"Счётчик каждого удара сердца и вдоха с момента твоего рождения в реальном времени.","ar":"عداد مباشر لكل نبضة قلب ونفس منذ لحظة وصولك.","zh":"从你出生那一刻起，实时统计的每一次心跳与呼吸。"},

 "secWorldSub": {"en":"The gemstone, flower, season, and generation tied to the month you were born.","he":"האבן, הפרח, העונה והדור הקשורים לחודש בו נולדת.","es":"La piedra, la flor, la estación y la generación ligadas al mes en que naciste.","fr":"La pierre, la fleur, la saison et la génération liées à votre mois de naissance.","de":"Der Edelstein, die Blume, die Jahreszeit und die Generation deines Geburtsmonats.","it":"La pietra, il fiore, la stagione e la generazione legati al tuo mese di nascita.","pt":"A pedra, a flor, a estação e a geração ligadas ao seu mês de nascimento.","ru":"Камень, цветок, сезон и поколение, связанные с месяцем твоего рождения.","ar":"الحجر والزهرة والفصل والجيل المرتبطون بشهر ميلادك.","zh":"与你出生月份相关的宝石、花朵、季节和世代。"},

 "secPricesSub": {"en":"Rough U.S. averages for that year, lined up against today\'s — and how crowded the planet was.","he":"ממוצעים אמריקאים גסים לאותה שנה, לצד היום — וכמה אנשים היו על הכוכב.","es":"Promedios aproximados de EE. UU. de ese año, junto a los de hoy, y cuán poblado estaba el planeta.","fr":"Moyennes américaines approximatives de cette année-là, comparées à aujourd\'hui, et la population du monde à l\'époque.","de":"Grobe US-Durchschnittswerte jenes Jahres neben den heutigen — und wie bevölkert der Planet war.","it":"Medie americane approssimative di quell\'anno, a confronto con oggi, e quanto era affollato il pianeta.","pt":"Médias aproximadas dos EUA daquele ano, lado a lado com as de hoje, e a população do planeta.","ru":"Приблизительные средние показатели США за тот год в сравнении с сегодняшними — и сколько людей жило на планете.","ar":"متوسطات أمريكية تقريبية لتلك السنة، مقارنة باليوم — وعدد سكان الكوكب حينها.","zh":"那一年的美国大致平均值与今天的对比，以及当时地球上的人口数量。"},

 "secCosmosSub": {"en":"How old you\'d be on other planets, how many full moons you\'ve watched, and how far you\'ve really traveled.","he":"בן כמה היית בכוכבים אחרים, כמה ירחים מלאים ראית, וכמה באמת נסעת.","es":"Qué edad tendrías en otros planetas, cuántas lunas llenas has visto y cuán lejos has viajado realmente.","fr":"Quel âge vous auriez sur d\'autres planètes, combien de pleines lunes vous avez vues, et la distance que vous avez vraiment parcourue.","de":"Wie alt du auf anderen Planeten wärst, wie viele Vollmonde du gesehen hast und wie weit du wirklich gereist bist.","it":"Quanti anni avresti su altri pianeti, quante lune piene hai visto e quanto hai davvero viaggiato.","pt":"Que idade você teria em outros planetas, quantas luas cheias você viu e o quão longe você realmente viajou.","ru":"Сколько бы тебе было лет на других планетах, сколько полнолуний ты видел и как далеко ты на самом деле путешествовал.","ar":"كم سيكون عمرك على كواكب أخرى، وكم بدرًا شهدت، وإلى أي مدى سافرت بالفعل.","zh":"你在其他星球上的年龄、你见过多少次满月，以及你究竟走过了多远的距离。"},

async function billboard(dateStr){
 const vdR=await fetch('https://raw.githubusercontent.com/mhollingshead/billboard-hot-100/main/valid_dates.json');
 if(!vdR.ok)throw 0;
 const vd=(await vdR.json()).sort();
 if(dateStr<vd[0])return{before1958:true};
 let best=vd[0];for(const d of vd){if(d<=dateStr)best=d;else break}
 const chR=await fetch('https://raw.githubusercontent.com/mhollingshead/billboard-hot-100/main/date/'+best+'.json');
 if(!chR.ok)throw 0;
 const ch=await chR.json();
 const top=ch.data.find(x=>x.this_week===1)||ch.data[0];
 return{weekOf:best,song:top.song,artist:top.artist};
}

function escapeHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
let historyReqId=0;
async function fetchHistory(mo,da,year){
 const reqId=++historyReqId;
 const g6=$('g6');g6.innerHTML='';
 const mm=String(mo).padStart(2,'0'),dd=String(da).padStart(2,'0');
 const peopleCard=document.createElement('div');peopleCard.className='card';
 peopleCard.innerHTML='<h3>🌟 '+t('famousPeople')+'</h3><div class="hlist"><div class="hrow muted"><span class="spin"></span>…</div></div>';
 g6.appendChild(peopleCard);
 const eventsCard=document.createElement('div');eventsCard.className='card';
 eventsCard.innerHTML='<h3>📰 '+t('newsEvents')+'</h3><div class="hlist"><div class="hrow muted"><span class="spin"></span>…</div></div>';
 g6.appendChild(eventsCard);
 try{
  const [bRes,eRes]=await Promise.all([
   fetch('https://en.wikipedia.org/api/rest_v1/feed/onthisday/births/'+mm+'/'+dd).then(r=>r.json()),
   fetch('https://en.wikipedia.org/api/rest_v1/feed/onthisday/events/'+mm+'/'+dd).then(r=>r.json())
  ]);
  if(reqId!==historyReqId)return;
  const births=(bRes.births||[]).filter(b=>b.year&&b.year!==year).sort((a,b)=>b.year-a.year).slice(0,8);
  peopleCard.querySelector('.hlist').innerHTML=births.length?
   births.map(b=>'<div class="hrow"><b>'+b.year+'</b> — '+escapeHtml(b.text)+'</div>').join(''):
   '<div class="hrow muted">'+t('noData')+'</div>';

  const allEvents=eRes.events||[];
  let sameYear=allEvents.filter(e=>e.year===year);
  let usedYear=sameYear.length>0;
  let events=usedYear?sameYear.slice(0,6):allEvents.slice().sort(()=>Math.random()-0.5).slice(0,6).sort((a,b)=>b.year-a.year);
  eventsCard.querySelector('.hlist').innerHTML=events.length?
   events.map(e=>'<div class="hrow"><b>'+e.year+'</b> — '+escapeHtml(e.text)+'</div>').join('')+
   (usedYear?'':'<div class="note">'+t('historyNote')+'</div>'):
   '<div class="hrow muted">'+t('noData')+'</div>';
 }catch(err){
  if(reqId!==historyReqId)return;
  peopleCard.querySelector('.hlist').innerHTML='<div class="hrow muted">'+t('historyOffline')+'</div>';
  eventsCard.querySelector('.hlist').innerHTML='<div class="hrow muted">'+t('historyOffline')+'</div>';
 }
}

let csTimer=null,csSkipped=false;
function runCutscene(done){
 const phases=['cs1','cs2','cs3','cs4','cs5','cs6','cs7','cs8','cs9'];
 const totalMs=17000+Math.floor(Math.random()*3000); // 17-20s
 const stepMs=totalMs/phases.length;
 const el=$('cutscene'),txt=$('csText'),bar=$('csBar'),skip=$('csSkip');
 csSkipped=false;
 skip.textContent=t('csSkip');
 el.classList.add('show');
 let i=0;
 const showPhase=()=>{
  const key=phases[i];
  txt.style.opacity=0;
  setTimeout(()=>{if(csSkipped)return;txt.textContent=t(key);txt.style.opacity=1},150);
  bar.style.width=(((i+1)/phases.length)*100)+'%';
  i++;
  if(i<phases.length){csTimer=setTimeout(showPhase,stepMs)}
  else{csTimer=setTimeout(finish,stepMs)}
 };
 const finish=()=>{
  if(csSkipped)return;
  el.classList.remove('show');
  bar.style.width='0%';
  done();
 };
 showPhase();
 skip.onclick=()=>{
  csSkipped=true;
  clearTimeout(csTimer);
  el.classList.remove('show');
  bar.style.width='0%';
  done();
 };
}

};
